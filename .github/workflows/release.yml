name: Release

# Publishes the GitHub Release for a v*.*.* tag from its CHANGELOG.md section.
# It does not deploy: production follows main through Cloudflare Workers
# Builds (the "Deploy default branch" trigger), so every push to main goes
# live and a tag only marks and documents a release.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any lint or format issue instead of fixing it on the runner,
      # where a fix would not reach the released code anyway.
      - name: Lint
        run: pnpm lint:ci

      - name: Lint CSS
        run: pnpm lint:css

      - name: Test
        run: pnpm vitest run

      - name: Build
        run: pnpm build

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag && !/^---$/ { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry found for version $version" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Markasso ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Markasso ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md
          fi
